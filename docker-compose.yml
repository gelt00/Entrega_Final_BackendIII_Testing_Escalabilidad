services:
  mongodb:
    image: mongo:7.0
    container_name: backend3-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: PasswordAdmin123!
      MONGO_INITDB_DATABASE: backend3
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: backend3-api-container
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://admin:PasswordAdmin123!@mongodb:27017/backend3?authSource=admin
      - NODE_ENV=production
      - JWT_SECRET=coderSecretKey123
      - JWT_EXPIRES_IN=24h
    depends_on:
      - mongodb

volumes:
  mongo_data:
